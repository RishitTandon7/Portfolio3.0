<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Certifications - Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Back to Portfolio</a></li>
      </ul>
    </nav>
  </header>

  <div class="section-divider"></div>
  <section class="section certificates-fullpage-section">
    <h2>All Certifications</h2>
    <div class="certificates-grid">
      <div class="certificate-item">
        <img class="certificate-img" src="Certi/IMG-20250502-WA0103.jpg" alt="Member of ISD lab" />
        <p>Member of Best lab</p>
      </div>
      <div class="certificate-item">
        <img class="certificate-img" src="Certi/IMG-20250502-WA0104.jpg" alt="ML workshop by Youtube" />
        <p>ML workshop by Youtube</p>
      </div>
      <div class="certificate-item">
        <img class="certificate-img" src="Certi/IMG-20250502-WA0105.jpg" alt="ML Learning bootcamp conducted by NextGenAI club" />
        <p>ML workshop by NextGenAI</p>
      </div>
      <div class="certificate-item">
        <img class="certificate-img" src="Certi/IMG-20250502-WA0107.jpg" alt="ML Learning bootcamp conducted by Flipkart" />
        <p>ML workshop by Flipkart</p>
      </div>
      <div class="certificate-item">
        <img class="certificate-img" src="Certi/IMG-20250502-WA0108.jpg" alt="Outer Space workshop by Cosmic Web" />
        <p>Outer Space workshop by Cosmic Web</p>
      </div>
      <div class="certificate-item">
        <img class="certificate-img" src="Certi/IMG-20250502-WA0109.jpg" alt="cybersecurity workshop conducted by HackTheBox" />
        <p>cybersecurity workshop</p>
      </div>
      <div class="certificate-item">
        <img class="certificate-img" src="Certi/IMG-20250502-WA0110.jpg" alt="Python Certification by Udemy" />
        <p>Python Certification</p>
      </div>
      <div class="certificate-item">
        <img class="certificate-img" src="Certi/IMG-20250502-WA0111.jpg" alt="GitHub workshop conducted by AlexaDeveloper Club" />
        <p>GitHub Certification</p>
      </div>
      <div class="certificate-item">
        <img class="certificate-img" src="Certi/IMG-20250502-WA0112.jpg" alt="Ethical Hacking Certification by Udemy" />
        <p>Ethical Hacking Certification</p>
      </div>
    </div>
  </section>

  <div class="section-divider"></div>

  <!-- Modal for enlarged certificate image -->
  <div id="certificate-modal" class="modal">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modal-image" />
    <div id="modal-caption"></div>
  </div>

  <div class="section-divider"></div>
</body>
</html>
